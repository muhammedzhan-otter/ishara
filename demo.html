<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Ishara: показ жестов</title>
    <style>
      body { margin: 0; background: #0b0d12; color: #eef1f6; font: 14px system-ui; }
      .grid { display: grid; grid-template-columns: repeat(4, 300px); gap: 10px; padding: 10px; }
      .cell { display: grid; gap: 4px; }
      .box { position: relative; width: 300px; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; }
    </style>
  </head>
  <body>
    <div class="grid" id="grid"></div>
    <script type="module">
      import '/src/style.css'
      import { SignDemo } from '/src/demo/signDemo.ts'
      import { ALL_SIGNS, SIGNS } from '/src/signs/catalog.ts'
      // ?t=1.2 замораживает все показы на этом моменте; ?crop=90,20,220,123.75 обрезка кадра
      const q = new URLSearchParams(location.search)
      const t = q.has('t') ? Number(q.get('t')) : null
      const crop = q.get('crop')?.split(',').map(Number) ?? undefined
      const only = q.get('signs')?.split(',') ?? ALL_SIGNS
      for (const id of only) {
        const d = new SignDemo(id, crop)
        d.seek(t)
        const box = document.createElement('div'); box.className = 'box'; box.append(d.el)
        const cell = document.createElement('div'); cell.className = 'cell'
        cell.append(box, `${SIGNS[id].word} (t=${t ?? 'анимация'})`)
        document.getElementById('grid').append(cell)
      }
    </script>
  </body>
</html>
